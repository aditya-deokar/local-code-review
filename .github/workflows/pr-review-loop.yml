name: PR Review & Self-Healing Loop

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: pr-review-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  review-and-heal:
    if: github.event.issue.pull_request && contains(github.event.comment.body, '@pr-review')
    runs-on: ubuntu-latest

    steps:
      - name: Acknowledge Trigger Comment (👀 Eyes Reaction)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/${{ github.repository }}/issues/comments/${{ github.event.comment.id }}/reactions" \
            -f content=eyes || true

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout PR Branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr checkout ${{ github.event.issue.number }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Pi CLI & Plannotator Extension
        run: |
          curl -fsSL https://pi.dev/install.sh | sh || npm install -g @earendil-works/pi-coding-agent
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          echo "$HOME/.pi/agent/bin" >> $GITHUB_PATH
          export PATH="$HOME/.local/bin:$HOME/.pi/agent/bin:$PATH"
          if ! command -v pi &> /dev/null; then
            npm install -g @earendil-works/pi-coding-agent
          fi
          pi --version
          pi install npm:@plannotator/pi-extension || true

      - name: Run Review & Self-Healing Loop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          chmod +x .github/scripts/run-review-loop.sh
          ./.github/scripts/run-review-loop.sh ${{ github.event.issue.number }}
